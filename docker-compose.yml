services:
  postgres:
    image: postgres:16-alpine
    container_name: teesgarage-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jeans_store
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: teesgarage-api
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=development
      - CORS_ORIGIN=*
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/jeans_store}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@localhost}
      - ADMIN_NAME=${ADMIN_NAME:-Local Administrator}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-local-dev-only-password}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-local-dev-admin-session-secret-change-me}
      - JWT_SECRET=${JWT_SECRET:-local-dev-customer-jwt-secret-change-me}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-local-development}
      - GCS_PRODUCT_IMAGES_BUCKET=${GCS_PRODUCT_IMAGES_BUCKET:-}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_REGION=${STORAGE_REGION:-auto}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:-}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:-}
      - STORAGE_FORCE_PATH_STYLE=${STORAGE_FORCE_PATH_STYLE:-false}
      - ASSET_BASE_URL=${ASSET_BASE_URL:-http://localhost:4000/assets}
      - FRONTEND_URL=http://storefront:3000
      - REVALIDATION_SECRET=${REVALIDATION_SECRET:-revalidate-secret-dev-key}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_ASSET_BASE_URL: ${NEXT_PUBLIC_ASSET_BASE_URL:-http://localhost:4000/assets}
    container_name: teesgarage-storefront
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://api:4000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_ASSET_BASE_URL=${NEXT_PUBLIC_ASSET_BASE_URL:-http://localhost:4000/assets}
      - REVALIDATION_SECRET=${REVALIDATION_SECRET:-revalidate-secret-dev-key}
      - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_ASSET_BASE_URL: ${NEXT_PUBLIC_ASSET_BASE_URL:-http://localhost:4000/assets}
    container_name: teesgarage-admin
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - API_URL=http://api:4000
      - NEXT_PUBLIC_ASSET_BASE_URL=${NEXT_PUBLIC_ASSET_BASE_URL:-http://localhost:4000/assets}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
