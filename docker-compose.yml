services:
  postgres:
    image: postgres:16-alpine
    container_name: teesgarage-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jeans_store
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: teesgarage-api
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/jeans_store}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-admin-secret-dev-key}
      - FRONTEND_URL=http://storefront:3000
      - REVALIDATION_SECRET=${REVALIDATION_SECRET:-revalidate-secret-dev-key}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: teesgarage-storefront
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://api:4000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - REVALIDATION_SECRET=${REVALIDATION_SECRET:-revalidate-secret-dev-key}
      - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: teesgarage-admin
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_ADMIN_API_KEY=${ADMIN_API_KEY:-admin-secret-dev-key}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
