name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      storefront: ${{ steps.filter.outputs.storefront }}
      api: ${{ steps.filter.outputs.api }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            storefront:
              - 'apps/storefront/**'
              - 'packages/**'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/ci.yml'

  storefront:
    needs: changes
    if: ${{ needs.changes.outputs.storefront == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run lint build --filter=@jeans-store/storefront

  api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jeans_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@jeans-store/api
      - name: Run Database Migrations
        run: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/jeans_store_test npm --workspace=@jeans-store/api run db:migrate
      - name: Run Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeans_store_test
        run: npx turbo run test --filter=@jeans-store/api

  admin:
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run lint build --filter=@jeans-store/admin
