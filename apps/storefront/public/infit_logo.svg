<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 38" width="160" height="38" fill="none">
  <style>
    .brand-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Space Grotesk", "Inter", sans-serif;
      font-weight: 850;
      font-size: 26px;
      letter-spacing: -0.04em;
      fill: #0c0e12;
    }
    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      font-weight: 600;
      font-size: 8px;
      letter-spacing: 0.22em;
      fill: #6b7280;
      text-transform: uppercase;
    }
    .accent-stitch {
      stroke: #2e445b;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 4 3;
    }
  </style>
  <!-- Selvedge Stitch Accent Mark -->
  <line x1="2" y1="9" x2="2" y2="29" class="accent-stitch" />
  <!-- Main INFIT Wordmark -->
  <text x="14" y="27" class="brand-text">INFIT</text>
  <!-- Subtle Studio Subtitle -->
  <text x="96" y="27" class="brand-sub">STUDIO</text>
</svg>
